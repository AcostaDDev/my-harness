<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf0ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111715" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>try { var t = localStorage.getItem("harness-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
    <title>My Harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
