# Fragment for an existing local-config-7 TOML, OUTSIDE the checkouts and chmod 600 (P011-T020, D168).
# In local-config-6/7 it selects django-recipe-2: the child is prepared with its own work language (en/es), chosen
# when it is created. The same keys in local-config-5 keep selecting the frozen django-recipe-1.
# Template NOT valid as is. Keep the operator's service/git/agents/agent_presets/registration.
# In the environment of BOTH effective roles/presets declare PYTHONDONTWRITEBYTECODE = "1".
# It keeps their Python commands from writing bytecode inside the accredited environment. The UI never edits the TOML.
# Add this composition to the catalog; if the TOML already declares [compositions.django], like the template,
# use another name (e.g. [compositions.django-recipe]). Create the child from the UI with it and bootstrap_enabled=true;
# the parent root is chosen in the UI, never inferred from this example. [registration].bootstrap_enabled=true.
# Loading it changes no global configuration and installs nothing. Enabling network here only sets a ceiling:
# each preparation confirms its own mode, manifest, argv and limits before running.

[recipes.django]
python_executable = "/ABSOLUTE/PATH/python3.13"
python_version = "3.13.1"                  # replace with the EXACT patch of the authorized interpreter, 3.11–3.13
installer_executable = "/ABSOLUTE/PATH/uv"
installer_version = "0.9.5"               # replace with the EXACT version of the authorized uv
allow_network = false                     # true allows requesting network mode in the preview; does not run it
# wheelhouse = "/ABSOLUTE/PATH/wheels"     # optional: local wheels prepared and authorized beforehand
# Offline uses --no-index/--find-links with a wheelhouse, or only the child's private cache without one.
# A new child with an empty cache and no wheelhouse fails offline without downloading or switching mode.
timeout_seconds = 120                     # ceiling per command, 120..1800 s; no global timeout or retry
max_output_bytes = 65536                   # per stream and command

[compositions.django]
profile = "python-django-recipe"           # packaged profile of the recipe; do not duplicate it in [profiles]
recipe = "django"
authorize_profile_commands = true
environment = {}                          # closed preparation environment and HOME/cache/tmp inside the child
executables = { python = { project_venv = "python" }, pytest = { project_venv = "pytest" }, ruff = { project_venv = "ruff" }, mypy = { project_venv = "mypy" } }
