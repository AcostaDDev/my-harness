<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planificador de tareas</title>
  </head>
  <body>
    <h1>Planificador de tareas</h1>
    <label for="tasks">Número de tareas (30 minutos cada una)</label>
    <input id="tasks" type="number" min="0" step="1" value="3">
    <output id="estimate" for="tasks" aria-live="polite"></output>
    <script type="module" src="./main.js"></script>
  </body>
</html>
